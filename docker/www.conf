; ===========================================
; PHP-FPM Pool Configuration
; ===========================================
; Ce fichier surcharge la configuration par défaut du pool www

[www]
; Process Manager settings
; -----------------------
; pm = dynamic : crée des workers à la demande
; pm.max_children : nombre maximum de workers (threads) simultanés
; pm.start_servers : workers lancés au démarrage
; pm.min_spare_servers : workers minimum en attente
; pm.max_spare_servers : workers maximum en attente

pm = dynamic
pm.max_children = 30
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10

; Chaque worker peut consommer ~50-100MB de RAM
; Avec 30 workers max: 30 x 100MB = 3GB RAM maximum
; Laisse ~1GB de marge sur les 4GB alloués

; Process timeout
pm.process_idle_timeout = 10s

; Max requests per worker before respawn (prevents memory leaks)
pm.max_requests = 500

; Status page (optionnel, pour monitoring)
pm.status_path = /fpm-status

; Slow log for debugging
slowlog = /var/log/php/slow.log
request_slowlog_timeout = 10s
