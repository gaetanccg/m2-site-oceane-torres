[PHP]
; Maximum execution time
max_execution_time = 120

; Maximum input time
max_input_time = 60

; Memory limit
memory_limit = 2048M

; Upload settings
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; Error reporting
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log

; Date timezone
date.timezone = Europe/Paris

; OPcache settings
[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
opcache.enable_cli = 0

; Pas de bloc [Session] : Laravel gere ses sessions lui-meme (SESSION_DRIVER) et
; n'appelle jamais session_start(). Les directives session.* de PHP ne servent qu'au
; gestionnaire natif, donc elles etaient sans effet — y compris session.cookie_secure = 0,
; qui pouvait faire croire a une regression de securite. Les vrais parametres du cookie
; sont dans config/session.php.
